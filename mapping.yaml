# Spalten-Mapping & Feld-Contract für die noch zu liefernden Quellen.
#
# Vorgehen bei Lieferung (Phase B):
#   1. python ingest.py <datei.xlsx> --inspect   ->  zeigt die echten Spalten +
#      heuristische Vorschläge (suggestions).
#   2. Hier unter `columns:` das interne Feld der realen Spalte zuordnen
#      (internes_feld: "Reale Spaltenüberschrift").
#   3. python ingest.py <datei.xlsx>             ->  lädt mit bestätigtem Mapping.
#
# `required_fields` MÜSSEN gemappt sein, sonst lädt der Loader nicht
# (keine erfundenen Daten). `optional_fields` sind nice-to-have.
# Statt Jahr/Monat/Woche kann auch ein `datum` gemappt werden – dann werden
# GJ/KW automatisch (ISO-Woche, inkl. Jahreswechsel-Logik) abgeleitet.

# ------------------------------------------------------------------
# Quelle 2: Artikel-Umsatz-Export (Drilldown unter der Warengruppe)
# ------------------------------------------------------------------
artikel:
  sheet: 0                      # Blattname oder -index
  required_fields:
    - artikel_id                # Artikelnummer / GTIN  (Join-Schlüssel)
    - umsatz
  optional_fields:
    - bezeichnung
    - warengruppe
    - abteilung
    - jahr
    - monat
    - woche
    - datum                     # Alternative zu jahr/monat/woche
    - menge
    - kunden
    - rohertrag                 # Rohertrag / Spanne
  columns: {}                   # z. B.  artikel_id: "Artikelnummer"
                                #        umsatz: "Umsatz"

# ------------------------------------------------------------------
# Quelle 3: Bestand / Verfügbarkeit (Ursachen-Overlay aus Bestellhilfe)
# ------------------------------------------------------------------
bestand:
  sheet: 0
  required_fields:
    - artikel_id                # gemeinsamer Join-Schlüssel mit Artikel-Umsatz
    - bestand
  optional_fields:
    - bezeichnung
    - warengruppe
    - abteilung
    - jahr
    - monat
    - woche
    - datum
    - luecke_flag               # Regallücke / Nullbestand (sonst: Bestand<=0)
    - lost_sale                 # Negativbestand / Lost-Sale-Indikator
  columns: {}

# Hinweis Join-Schlüssel: artikel_id muss in Artikel-Umsatz UND Bestand
# identisch formatiert sein (GTIN vs. interne Nr.). Bei Abweichung hier einen
# zweiten Mapping-Schritt einplanen (z. B. Cross-Reference-Tabelle).

# ==================================================================
# PHASE C – Wetter-/Faktor-Prognose (aus Grilling-Session abgeleitet)
# Nur für eine schmale WATCHLIST faktor-sensibler Artikel, NICHT als
# Bestell-Ersatz. Prognose gilt für NORMAL-Wochen; Aktionswochen werden
# beim Lernen der Normal-Erwartung AUSGESCHLOSSEN (Aktion = Filter, nicht
# Modellfaktor). Details: docs/ROADMAP_PROGNOSE.md
# ==================================================================

# ------------------------------------------------------------------
# Quelle 4: Tagesabsatz (Tagesgenauigkeit, Menge ist der Wetter-Hebel)
# ------------------------------------------------------------------
tagesabsatz:
  sheet: 0
  required_fields:
    - artikel_id                # Join-Schlüssel zu Artikel/Bestand
    - datum                     # TAGESdatum (nicht KW!) – Wetter wirkt tagesweise
    - menge                     # Absatzmenge in Stück/Einheiten
  optional_fields:
    - bezeichnung
    - warengruppe
    - abteilung
    - umsatz
  columns: {}

# ------------------------------------------------------------------
# Quelle 5: Aktions-/Werbekalender  – NUR VERGANGENHEIT, NUR Maschinenraum
#   Zweck: Aktionswochen aus der Normal-Erwartung ausschliessen (sonst
#   Prognose systematisch zu hoch). Erscheint in KEINEM UI-Screen.
#   ZUKUNFTS-Aktion ist bewusst NICHT in der App (Nutzer-Entscheidung):
#   der Aktions-Schub der kommenden Woche wird vom Nutzer selbst beachtet.
#   Variante B (ganz ohne diese Datei): Aktionswochen werden statt dessen
#   als statistische Ausreisser erkannt und ausgeschlossen (groeber).
# ------------------------------------------------------------------
aktion:
  sheet: 0
  required_fields:
    - datum                     # oder jahr/woche
    - aktion_flag               # Artikel/WG an diesem Tag/KW in Aktion (Historie)?
  optional_fields:
    - artikel_id                # wenn artikelgenau; sonst warengruppe
    - warengruppe
    - aktionsart                # Prospekt / Zweitplatzierung / Preis
    - jahr
    - woche
  columns: {}
  # Hinweis: Diese Quelle ist OPTIONAL. Fehlt sie, greift die Ausreisser-
  # Erkennung (Variante B). Wird sie geliefert, reinigt sie die Lernbasis
  # exakt (Variante A) – ohne je in der UI aufzutauchen.

# ------------------------------------------------------------------
# Quelle 6: Watchlist & Standort (Konfig, keine Wochen-Datei)
#   watchlist: faktor-sensible Artikel/WG. Empfehlung: Tool flaggt
#   Kandidaten automatisch aus der Tageshistorie (Wetter-Korrelations-
#   stärke) -> du bestätigst einmalig. Hier manuell pinnbar.
#   plz: für den Wetterbezug (Historie zum Lernen + 2-Tage-Vorhersage).
#   Wetterdaten werden extern geholt; Verkaufsdaten bleiben lokal.
# ------------------------------------------------------------------
prognose:
  markt_plz: ""                 # z. B. "30161"
  watchlist_artikel: []         # optionale feste Liste von artikel_id
  watchlist_warengruppen: []    # oder ganze Warengruppen
  auto_flag: true               # Kandidaten autom. aus Korrelation vorschlagen
  bestell_vorlauf_tage: 2       # Mo->Mi, Di->Do, Mi->Fr, Sa->Di

